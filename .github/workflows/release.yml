name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build & Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: psychoquine
            asset_name: psychoquine-linux-amd64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: psychoquine
            asset_name: psychoquine-macos-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: psychoquine.exe
            asset_name: psychoquine-windows-amd64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release asset & generate checksum
        shell: bash
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${{ matrix.asset_name }}" "./${BIN_DIR}/${{ matrix.binary_name }}"
            powershell -Command "Get-FileHash -Algorithm SHA256 '${{ matrix.asset_name }}' | ForEach-Object { \"$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)\" }" > "${{ matrix.asset_name }}.sha256"
          else
            tar -czvf "${{ matrix.asset_name }}" -C "${BIN_DIR}" "${{ matrix.binary_name }}"
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
